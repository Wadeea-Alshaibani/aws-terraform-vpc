name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Format check
        run: terraform fmt -recursive -check -diff

      - name: Init (no backend, no AWS credentials needed)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Unit tests (mocked AWS provider)
        run: terraform test

      - name: Validate bootstrap
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov static security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          # Report findings without failing the build while the project is a lab.
          soft_fail: true
